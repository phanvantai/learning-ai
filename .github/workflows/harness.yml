name: harness

on:
  push:
    paths: ["harness/**", ".github/workflows/harness.yml"]
  pull_request:
    paths: ["harness/**", ".github/workflows/harness.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: harness
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
