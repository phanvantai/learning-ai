name: harness-app

# Builds the desktop installers. Runs when the app shell changes, on demand,
# and on a `harness-v*` tag, which also drafts a GitHub release.
on:
  push:
    branches: ["**"]
    tags: ["harness-v*"]
    paths: ["harness/app/**", ".github/workflows/harness-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            artifact: harness/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            args: ""
            artifact: harness/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: harness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build installer
        working-directory: harness/app
        env:
          # Optional: bake in a shared Google OAuth client so users skip that setup step.
          LAI_GMAIL_CLIENT_ID: ${{ secrets.LAI_GMAIL_CLIENT_ID }}
          LAI_GMAIL_CLIENT_SECRET: ${{ secrets.LAI_GMAIL_CLIENT_SECRET }}
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}
      # Start the app we just built and wait for its window to load the UI
      # and call back with the access token only that window holds.
      - name: Check the built app opens
        shell: bash
        run: |
          export LAI_HOME="$RUNNER_TEMP/lai-smoke"
          mkdir -p "$LAI_HOME"
          if [ "$RUNNER_OS" = "macOS" ]; then
            app=$(ls -d harness/target/universal-apple-darwin/release/bundle/macos/*.app)
            "$app"/Contents/MacOS/* &
          else
            ./harness/target/release/lai-app.exe &
          fi
          for i in $(seq 1 90); do
            if [ -f "$LAI_HOME/run/ui-loaded" ]; then echo "Window loaded the UI after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "The window never loaded the UI"
          ls -R "$LAI_HOME" || true
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: tro-ly-ai-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/harness-v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.artifact }}
